# Включаю внутри действующего HTTPS server портфолио. Префикс снимается перед приложением.
location = /iskra {
    return 308 /iskra/$is_args$args;
}
location ^~ /iskra/ {
    if ($host != amo0orkie.ru) {
        return 308 https://amo0orkie.ru$request_uri;
    }
    proxy_pass http://127.0.0.1:4327/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_send_timeout 15s;
    proxy_buffering off;
    client_max_body_size 500k;
}
