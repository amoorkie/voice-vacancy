name: Application

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Действия закреплены по проверенным SHA тегов v6.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # В образе GitHub уже есть Chrome и Edge: не жду повторной загрузки браузера и apt.
      - run: google-chrome --version && microsoft-edge --version
      - run: npm run test:e2e
        env:
          CI: 'true'
          TEST_BROWSER: chrome,msedge
      - run: python3 scripts/check_docs.py
